<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Chat | Satyakam Swami</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Stranger Audio Chat</h1>
        <p id="status-text">Status: Disconnected</p>

        <audio id="remote-audio" autoplay playsinline></audio>

        <div class="controls">
            <button id="btn-new">Connect to New Caller</button>
            <button id="btn-reconnect">Reconnect to Previous</button>
        </div>

        <div class="call-controls" id="call-controls" style="display: none;">
            <button id="btn-mute">Mute Mic</button>
            <button id="btn-disconnect">Disconnect</button>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
