<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Audio Chat</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Audio Chat Room</h1>
        
        <div class="status-box">
            <p id="statusText">Requesting microphone access...</p>
        </div>

        <div class="controls">
            <button id="btnNew" class="btn-primary" disabled>Find Partner</button>
            <button id="btnReconnect" class="btn-secondary" disabled>Reconnect</button>
            <button id="btnHangup" class="btn-danger" disabled>Hang Up</button>
        </div>

        <audio id="remoteAudio" autoplay playsinline></audio>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
